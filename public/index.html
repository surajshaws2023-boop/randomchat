<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Stranger</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1526; --panel:#182038; --line:#2a3558; --text:#eef1fb; --dim:#98a3c7;
  --accent:#7c6cff; --next:#ffb547; --danger:#ff6b81;
}
@media (prefers-color-scheme: light){
  :root{--bg:#eef0f8; --panel:#fff; --line:#d5d9ec; --text:#141a30; --dim:#5b6488;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.7rem 1.2rem;font-weight:600;color:#fff;background:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--next);outline-offset:2px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.next{background:var(--next);color:#231a00}
button.danger{background:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}

/* Landing */
#landing{min-height:100%;display:grid;place-items:center;padding:1.5rem}
.card{max-width:460px;width:100%}
h1{font-size:clamp(2.6rem,9vw,4rem);line-height:1;margin:0 0 .75rem;font-weight:800;letter-spacing:-.03em}
.card p{color:var(--dim);margin:0 0 1.5rem;max-width:40ch}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.row button{flex:1 1 180px;padding:1rem}
label.age{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 1.25rem;color:var(--dim);font-size:.9rem}
label.age input{margin-top:.3rem;accent-color:var(--accent)}
.online{margin-top:1.5rem;color:var(--dim);font-size:.9rem}
#landErr{color:var(--danger);min-height:1.5em;margin:.75rem 0 0}

.prefs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:0 0 1.25rem}
.prefs input,.prefs select{min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;font:inherit}
#interests,#filter{grid-column:1/-1}

.acct{display:grid;gap:.6rem;margin:0 0 1.25rem;color:var(--dim);font-size:.9rem}
.acct b{color:var(--text)}
.acct select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;font:inherit}
.acct .row2{display:flex;gap:.5rem}.acct .row2 select{flex:1}
.acct .plans{display:flex;gap:.5rem}
.acct .plans button{flex:1;padding:.6rem .3rem;font-size:.85rem}

/* Chat */
#chat{height:100%;display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
.stage{position:relative;background:#000;border-radius:16px;overflow:hidden;min-height:0;display:grid;place-items:center}
#remote{width:100%;height:100%;object-fit:cover;background:#000}
#local{position:absolute;right:12px;bottom:12px;width:26%;max-width:200px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid var(--line);background:#111;transform:scaleX(-1)}
#status{position:absolute;left:12px;top:12px;background:rgba(15,21,38,.8);color:#eef1fb;padding:.35rem .8rem;border-radius:99px;font-size:.9rem}
.side{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:0}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.msg{max-width:85%;padding:.5rem .8rem;border-radius:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;color:var(--dim);font-size:.85rem;text-align:center}
#form{display:flex;gap:.5rem;padding:.75rem;border-top:1px solid var(--line)}
#input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;font:inherit}
.controls{display:flex;gap:.5rem;padding:.75rem;border-top:1px solid var(--line);flex-wrap:wrap}
.controls button{flex:1;padding:.6rem .5rem;font-size:.9rem}
body.textmode .stage{display:none}
body.textmode #chat{grid-template-columns:minmax(0,720px);justify-content:center}

@media (max-width:800px){
  #chat{grid-template-columns:1fr;grid-template-rows:45% 1fr}
  body.textmode #chat{grid-template-rows:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .msg{animation:pop .15s ease-out}
  @keyframes pop{from{transform:translateY(4px);opacity:0}}
}
</style>
</head>
<body>

<main id="landing">
  <div class="card">
    <h1>Hello, stranger.</h1>
    <p>Get paired with someone random for a video or text conversation. Nothing is saved, and you can hit Next any time.</p>
    <div id="acct" class="acct"></div>
    <div class="prefs">
      <input id="interests" placeholder="Interests, separated by commas (optional)" maxlength="80">
      <select id="country" aria-label="Your country"></select>
      <select id="language" aria-label="Your language"></select>
      <select id="filter" aria-label="Match with">
        <option value="any">Match with anyone</option>
        <option value="country">Same country only</option>
        <option value="language">Same language only</option>
      </select>
    </div>
    <label class="age"><input type="checkbox" id="age"> <span>I am 18 or older and agree to be respectful. Reports may be reviewed.</span></label>
    <div class="row">
      <button id="startVideo">Start video chat</button>
      <button id="startText" class="ghost">Start text chat</button>
    </div>
    <p id="landErr" role="alert"></p>
    <div class="online"><span id="count">–</span> people online</div>
  </div>
</main>

<main id="chat" class="hidden">
  <section class="stage">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>
    <div id="status">Connecting…</div>
  </section>
  <aside class="side">
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="input" autocomplete="off" maxlength="500" placeholder="Type a message" disabled>
      <button id="sendBtn" disabled>Send</button>
    </form>
    <div class="controls">
      <button id="nextBtn" class="next">Next</button>
      <button id="muteBtn" class="ghost">Mute</button>
      <button id="camBtn" class="ghost">Camera off</button>
      <button id="reportBtn" class="ghost">Report</button>
      <button id="soundBtn" class="ghost">Sound on</button>
      <button id="stopBtn" class="danger">Stop</button>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
  // For reliability behind strict NATs, add a TURN server here:
  // { urls: 'turn:your.turn.server:3478', username: '...', credential: '...' }
]};

let ws, pc, localStream, mode = 'video', connected = false, queue = Promise.resolve();

/* ---------- Match preferences ---------- */
const COUNTRIES = ['IN','US','GB','CA','AU','DE','FR','ES','BR','MX','ID','PH','PK','BD','NG','EG','TR','RU','JP','KR'];
const LANGS = ['en','hi','bn','es','fr','ar','pt','de','ru','ja','ko','zh','tr','id','ur'];
const rn = new Intl.DisplayNames(['en'], { type: 'region' }), ln = new Intl.DisplayNames(['en'], { type: 'language' });
const fill = (sel, codes, name, def) => {
  $(sel).innerHTML = codes.map(c => `<option value="${c.toLowerCase()}">${name.of(c)}</option>`).join('');
  $(sel).value = def.toLowerCase();
};
const loc = (navigator.language || 'en-US').split('-');
fill('#country', COUNTRIES, rn, loc[1] || 'US');
fill('#language', LANGS, ln, loc[0]);
const prefs = () => ({
  interests: $('#interests').value.split(',').map(s => s.trim()).filter(Boolean),
  country: $('#country').value, language: $('#language').value, filter: $('#filter').value,
  token, want: ($('#want') || {}).value || ''
});

/* ---------- Account and premium ---------- */
let cfg = {}, token = localStorage.getItem('token'), user = null;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
async function api(path, body){
  const r = await fetch('/api/' + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
function renderAcct(){
  const el = $('#acct');
  if (!cfg.enabled || !cfg.google) { el.innerHTML = ''; return; }
  if (!user){
    el.innerHTML = '<div id="gbtn"></div><small>Sign in to use the paid gender filter.</small>';
    if (window.google && google.accounts){
      google.accounts.id.initialize({ client_id: cfg.google, callback: onGoogle });
      google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large' });
    }
    return;
  }
  let h = `<div>Signed in as <b>${esc(user.email)}</b> · <a href="#" id="logout">Sign out</a></div>`;
  if (!user.gender) h += '<div class="row2"><select id="gsel"><option value="">I am…</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select><button id="gsave" class="ghost">Save</button></div><small>You cannot change this later.</small>';
  if (user.premium) h += `<div>Premium until <b>${new Date(user.premiumUntil).toLocaleDateString()}</b></div><select id="want" aria-label="Gender filter"><option value="">Match with anyone</option><option value="female">Women only</option><option value="male">Men only</option></select>`;
  if (cfg.razorpay) h += '<small>' + (user.premium ? 'Add more time:' : 'Unlock the gender filter:') + '</small><div class="plans">' + Object.entries(cfg.plans).map(([k, p]) => `<button data-plan="${k}">${esc(p.label)}<br>₹${p.rupees}</button>`).join('') + '</div>';
  el.innerHTML = h;
}
async function onGoogle(r){
  try {
    const d = await api('google', { credential: r.credential });
    token = d.token; user = d.user; localStorage.setItem('token', token); renderAcct();
  } catch (e) { $('#landErr').textContent = e.message; }
}
async function buy(plan){
  try {
    const o = await api('order', { plan });
    new Razorpay({
      key: o.keyId, order_id: o.orderId, amount: o.amount, currency: 'INR',
      name: 'Hello Stranger', description: cfg.plans[plan].label, prefill: { email: user.email },
      handler: async r => {
        try { ({ user } = await api('verify', r)); renderAcct(); }
        catch (e) { $('#landErr').textContent = e.message; }
      }
    }).open();
  } catch (e) { $('#landErr').textContent = e.message; }
}
$('#acct').onclick = async e => {
  const t = e.target;
  try {
    if (t.id === 'logout'){ e.preventDefault(); token = user = null; localStorage.removeItem('token'); renderAcct(); }
    if (t.id === 'gsave' && $('#gsel').value){ ({ user } = await api('profile', { gender: $('#gsel').value })); renderAcct(); }
    if (t.dataset.plan) buy(t.dataset.plan);
  } catch (err) { $('#landErr').textContent = err.message; }
};
window.addEventListener('load', async () => {
  try { cfg = await api('config'); } catch (e) {}
  if (token && cfg.enabled){
    try { user = (await api('me')).user; } catch (e) { token = null; localStorage.removeItem('token'); }
  }
  renderAcct();
});

/* ---------- Sounds and tab alerts ---------- */
let soundOn = true, actx;
function audio(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function beep(freq, dur, delay = 0){
  if (!soundOn) return;
  try {
    const c = audio(), t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.08, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const chime = () => { beep(660, .12); beep(880, .18, .13); };
const blip = () => beep(520, .08);
const down = () => beep(300, .25);
const baseTitle = document.title;
function alertTitle(t){ if (document.hidden) document.title = '💬 ' + t; }
document.addEventListener('visibilitychange', () => { if (!document.hidden) document.title = baseTitle; });

/* ---------- UI helpers ---------- */
function setStatus(t){ $('#status').textContent = t; }
function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;                 // textContent prevents HTML injection
  $('#log').appendChild(d);
  $('#log').scrollTop = 1e9;
}
function setConnected(on){
  connected = on;
  $('#input').disabled = !on;
  $('#sendBtn').disabled = !on;
  $('#reportBtn').disabled = !on;
  if (on) $('#input').focus();
}
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

/* ---------- Start / stop ---------- */
async function start(m){
  $('#landErr').textContent = '';
  if (!$('#age').checked){ $('#landErr').textContent = 'Please confirm you are 18 or older.'; return; }
  mode = m;
  try { audio(); } catch (e) {}
  if (mode === 'video'){
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      $('#local').srcObject = localStream;
    } catch (e) {
      $('#landErr').textContent = 'Camera and microphone access is required for video chat. Allow access in your browser, or try text chat.';
      return;
    }
  }
  document.body.classList.toggle('textmode', mode === 'text');
  $('#local').classList.toggle('hidden', mode === 'text');
  $('#muteBtn').classList.toggle('hidden', mode === 'text');
  $('#camBtn').classList.toggle('hidden', mode === 'text');
  $('#landing').classList.add('hidden');
  $('#chat').classList.remove('hidden');
  $('#log').innerHTML = '';
  setConnected(false);
  setStatus('Connecting…');

  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => send({ type: 'find', mode, ...prefs() });
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { if (!$('#chat').classList.contains('hidden')){ closePeer(); setConnected(false); setStatus('Disconnected. Refresh the page to reconnect.'); } };
}

function stop(){
  send({ type: 'stop' });
  closePeer();
  if (ws){ ws.onclose = null; ws.close(); ws = null; }
  if (localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  setConnected(false);
  $('#chat').classList.add('hidden');
  $('#landing').classList.remove('hidden');
}

function next(){
  closePeer();
  setConnected(false);
  $('#log').innerHTML = '';
  setStatus('Looking for someone…');
  send({ type: 'next' });
}

/* ---------- Server messages ---------- */
function handle(m){
  switch (m.type){
    case 'count': $('#count').textContent = m.n; break;
    case 'waiting':
      setStatus('Looking for someone…');
      addMsg('Waiting for someone to join. Hang tight.', 'sys');
      break;
    case 'matched':
      closePeer();
      $('#log').innerHTML = '';
      setConnected(true);
      setStatus('Connected');
      addMsg('You are connected. Say hi.', 'sys');
      if (m.common && m.common.length) addMsg('You both like: ' + m.common.join(', '), 'sys');
      chime(); alertTitle('Matched!');
      if (mode === 'video') startPeer(m.initiator);
      break;
    case 'banned':
      stop();
      $('#landErr').textContent = 'You have been banned for 24 hours after several reports.';
      break;
    case 'signal': queue = queue.then(() => onSignal(m.data)).catch(console.error); break;
    case 'chat': addMsg(m.text, 'them'); blip(); alertTitle('New message'); break;
    case 'left':
      closePeer();
      setConnected(false);
      setStatus('Stranger left');
      addMsg('Stranger left. Press Next to meet someone else.', 'sys');
      down(); alertTitle('Stranger left');
      break;
  }
}

/* ---------- WebRTC ---------- */
function startPeer(initiator){
  pc = new RTCPeerConnection(ICE);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $('#remote').srcObject = e.streams[0]; };
  pc.onicecandidate = e => { if (e.candidate) send({ type: 'signal', data: { candidate: e.candidate } }); };
  pc.onconnectionstatechange = () => {
    if (pc && pc.connectionState === 'failed') setStatus('Video connection failed. Press Next.');
  };
  if (initiator){
    pc.createOffer()
      .then(o => pc.setLocalDescription(o))
      .then(() => send({ type: 'signal', data: { sdp: pc.localDescription } }))
      .catch(console.error);
  }
}

async function onSignal(d){
  if (!pc) return;
  if (d.sdp){
    await pc.setRemoteDescription(d.sdp);
    if (d.sdp.type === 'offer'){
      await pc.setLocalDescription(await pc.createAnswer());
      send({ type: 'signal', data: { sdp: pc.localDescription } });
    }
  } else if (d.candidate){
    try { await pc.addIceCandidate(d.candidate); } catch (e) { /* ignore stale candidates */ }
  }
}

function closePeer(){
  if (pc){ pc.onicecandidate = pc.ontrack = pc.onconnectionstatechange = null; pc.close(); pc = null; }
  $('#remote').srcObject = null;
  queue = Promise.resolve();
}

/* ---------- Events ---------- */
$('#soundBtn').onclick = e => {
  soundOn = !soundOn;
  e.target.textContent = soundOn ? 'Sound on' : 'Sound off';
};
$('#startVideo').onclick = () => start('video');
$('#startText').onclick = () => start('text');
$('#nextBtn').onclick = next;
$('#stopBtn').onclick = stop;
$('#reportBtn').onclick = () => {
  send({ type: 'report' });
  addMsg('Report sent. Finding someone new…', 'sys');
  next();
};
$('#form').onsubmit = e => {
  e.preventDefault();
  const t = $('#input').value.trim();
  if (!t || !connected) return;
  send({ type: 'chat', text: t });
  addMsg(t, 'me');
  $('#input').value = '';
};
$('#muteBtn').onclick = e => {
  const track = localStream && localStream.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  e.target.textContent = track.enabled ? 'Mute' : 'Unmute';
};
$('#camBtn').onclick = e => {
  const track = localStream && localStream.getVideoTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  e.target.textContent = track.enabled ? 'Camera off' : 'Camera on';
};
</script>
</body>
</html>
