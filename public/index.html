<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Stranger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1526; --panel:#182038; --line:#2a3558; --text:#eef1fb; --dim:#98a3c7;
  --accent:#7c6cff; --next:#ffb547; --danger:#ff6b81;
}
@media (prefers-color-scheme: light){
  :root{--bg:#eef0f8; --panel:#fff; --line:#d5d9ec; --text:#141a30; --dim:#5b6488;}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.7rem 1.2rem;font-weight:600;color:#fff;background:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--next);outline-offset:2px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
button.next{background:var(--next);color:#231a00}
button.danger{background:var(--danger)}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}

/* Landing */
#landing{min-height:100%;display:grid;place-items:center;padding:1.5rem}
.card{max-width:460px;width:100%}
h1{font-size:clamp(2.6rem,9vw,4rem);line-height:1;margin:0 0 .75rem;font-weight:800;letter-spacing:-.03em}
.card p{color:var(--dim);margin:0 0 1.5rem;max-width:40ch}
.row{display:flex;gap:.75rem;flex-wrap:wrap}
.row button{flex:1 1 180px;padding:1rem}
label.age{display:flex;gap:.6rem;align-items:flex-start;margin:0 0 1.25rem;color:var(--dim);font-size:.9rem}
label.age input{margin-top:.3rem;accent-color:var(--accent)}
.online{margin-top:1.5rem;color:var(--dim);font-size:.9rem}
#landErr{color:var(--danger);min-height:1.5em;margin:.75rem 0 0}

/* Chat */
#chat{height:100%;display:grid;grid-template-columns:1fr 360px;gap:12px;padding:12px}
.stage{position:relative;background:#000;border-radius:16px;overflow:hidden;min-height:0;display:grid;place-items:center}
#remote{width:100%;height:100%;object-fit:cover;background:#000}
#local{position:absolute;right:12px;bottom:12px;width:26%;max-width:200px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:2px solid var(--line);background:#111;transform:scaleX(-1)}
#status{position:absolute;left:12px;top:12px;background:rgba(15,21,38,.8);color:#eef1fb;padding:.35rem .8rem;border-radius:99px;font-size:.9rem}
.side{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-height:0}
#log{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.msg{max-width:85%;padding:.5rem .8rem;border-radius:14px;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;color:var(--dim);font-size:.85rem;text-align:center}
#form{display:flex;gap:.5rem;padding:.75rem;border-top:1px solid var(--line)}
#input{flex:1;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.7rem .9rem;font:inherit}
.controls{display:flex;gap:.5rem;padding:.75rem;border-top:1px solid var(--line);flex-wrap:wrap}
.controls button{flex:1;padding:.6rem .5rem;font-size:.9rem}
body.textmode .stage{display:none}
body.textmode #chat{grid-template-columns:minmax(0,720px);justify-content:center}

@media (max-width:800px){
  #chat{grid-template-columns:1fr;grid-template-rows:45% 1fr}
  body.textmode #chat{grid-template-rows:1fr}
}
@media (prefers-reduced-motion:no-preference){
  .msg{animation:pop .15s ease-out}
  @keyframes pop{from{transform:translateY(4px);opacity:0}}
}
</style>
</head>
<body>

<main id="landing">
  <div class="card">
    <h1>Hello, stranger.</h1>
    <p>Get paired with someone random for a video or text conversation. Nothing is saved, and you can hit Next any time.</p>
    <label class="age"><input type="checkbox" id="age"> <span>I am 18 or older and agree to be respectful. Reports may be reviewed.</span></label>
    <div class="row">
      <button id="startVideo">Start video chat</button>
      <button id="startText" class="ghost">Start text chat</button>
    </div>
    <p id="landErr" role="alert"></p>
    <div class="online"><span id="count">–</span> people online</div>
  </div>
</main>

<main id="chat" class="hidden">
  <section class="stage">
    <video id="remote" autoplay playsinline></video>
    <video id="local" autoplay playsinline muted></video>
    <div id="status">Connecting…</div>
  </section>
  <aside class="side">
    <div id="log" aria-live="polite"></div>
    <form id="form">
      <input id="input" autocomplete="off" maxlength="500" placeholder="Type a message" disabled>
      <button id="sendBtn" disabled>Send</button>
    </form>
    <div class="controls">
      <button id="nextBtn" class="next">Next</button>
      <button id="muteBtn" class="ghost">Mute</button>
      <button id="camBtn" class="ghost">Camera off</button>
      <button id="reportBtn" class="ghost">Report</button>
      <button id="stopBtn" class="danger">Stop</button>
    </div>
  </aside>
</main>

<script>
const $ = s => document.querySelector(s);
const ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
  // For reliability behind strict NATs, add a TURN server here:
  // { urls: 'turn:your.turn.server:3478', username: '...', credential: '...' }
]};

let ws, pc, localStream, mode = 'video', connected = false, queue = Promise.resolve();

/* ---------- UI helpers ---------- */
function setStatus(t){ $('#status').textContent = t; }
function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;                 // textContent prevents HTML injection
  $('#log').appendChild(d);
  $('#log').scrollTop = 1e9;
}
function setConnected(on){
  connected = on;
  $('#input').disabled = !on;
  $('#sendBtn').disabled = !on;
  $('#reportBtn').disabled = !on;
  if (on) $('#input').focus();
}
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));

/* ---------- Start / stop ---------- */
async function start(m){
  $('#landErr').textContent = '';
  if (!$('#age').checked){ $('#landErr').textContent = 'Please confirm you are 18 or older.'; return; }
  mode = m;
  if (mode === 'video'){
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      $('#local').srcObject = localStream;
    } catch (e) {
      $('#landErr').textContent = 'Camera and microphone access is required for video chat. Allow access in your browser, or try text chat.';
      return;
    }
  }
  document.body.classList.toggle('textmode', mode === 'text');
  $('#local').classList.toggle('hidden', mode === 'text');
  $('#muteBtn').classList.toggle('hidden', mode === 'text');
  $('#camBtn').classList.toggle('hidden', mode === 'text');
  $('#landing').classList.add('hidden');
  $('#chat').classList.remove('hidden');
  $('#log').innerHTML = '';
  setConnected(false);
  setStatus('Connecting…');

  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => send({ type: 'find', mode });
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { if (!$('#chat').classList.contains('hidden')){ closePeer(); setConnected(false); setStatus('Disconnected. Refresh the page to reconnect.'); } };
}

function stop(){
  send({ type: 'stop' });
  closePeer();
  if (ws){ ws.onclose = null; ws.close(); ws = null; }
  if (localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  setConnected(false);
  $('#chat').classList.add('hidden');
  $('#landing').classList.remove('hidden');
}

function next(){
  closePeer();
  setConnected(false);
  $('#log').innerHTML = '';
  setStatus('Looking for someone…');
  send({ type: 'next' });
}

/* ---------- Server messages ---------- */
function handle(m){
  switch (m.type){
    case 'count': $('#count').textContent = m.n; break;
    case 'waiting':
      setStatus('Looking for someone…');
      addMsg('Waiting for someone to join. Hang tight.', 'sys');
      break;
    case 'matched':
      closePeer();
      $('#log').innerHTML = '';
      setConnected(true);
      setStatus('Connected');
      addMsg('You are connected. Say hi.', 'sys');
      if (mode === 'video') startPeer(m.initiator);
      break;
    case 'signal': queue = queue.then(() => onSignal(m.data)).catch(console.error); break;
    case 'chat': addMsg(m.text, 'them'); break;
    case 'left':
      closePeer();
      setConnected(false);
      setStatus('Stranger left');
      addMsg('Stranger left. Press Next to meet someone else.', 'sys');
      break;
  }
}

/* ---------- WebRTC ---------- */
function startPeer(initiator){
  pc = new RTCPeerConnection(ICE);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $('#remote').srcObject = e.streams[0]; };
  pc.onicecandidate = e => { if (e.candidate) send({ type: 'signal', data: { candidate: e.candidate } }); };
  pc.onconnectionstatechange = () => {
    if (pc && pc.connectionState === 'failed') setStatus('Video connection failed. Press Next.');
  };
  if (initiator){
    pc.createOffer()
      .then(o => pc.setLocalDescription(o))
      .then(() => send({ type: 'signal', data: { sdp: pc.localDescription } }))
      .catch(console.error);
  }
}

async function onSignal(d){
  if (!pc) return;
  if (d.sdp){
    await pc.setRemoteDescription(d.sdp);
    if (d.sdp.type === 'offer'){
      await pc.setLocalDescription(await pc.createAnswer());
      send({ type: 'signal', data: { sdp: pc.localDescription } });
    }
  } else if (d.candidate){
    try { await pc.addIceCandidate(d.candidate); } catch (e) { /* ignore stale candidates */ }
  }
}

function closePeer(){
  if (pc){ pc.onicecandidate = pc.ontrack = pc.onconnectionstatechange = null; pc.close(); pc = null; }
  $('#remote').srcObject = null;
  queue = Promise.resolve();
}

/* ---------- Events ---------- */
$('#startVideo').onclick = () => start('video');
$('#startText').onclick = () => start('text');
$('#nextBtn').onclick = next;
$('#stopBtn').onclick = stop;
$('#reportBtn').onclick = () => {
  send({ type: 'report' });
  addMsg('Report sent. Finding someone new…', 'sys');
  next();
};
$('#form').onsubmit = e => {
  e.preventDefault();
  const t = $('#input').value.trim();
  if (!t || !connected) return;
  send({ type: 'chat', text: t });
  addMsg(t, 'me');
  $('#input').value = '';
};
$('#muteBtn').onclick = e => {
  const track = localStream && localStream.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  e.target.textContent = track.enabled ? 'Mute' : 'Unmute';
};
$('#camBtn').onclick = e => {
  const track = localStream && localStream.getVideoTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  e.target.textContent = track.enabled ? 'Camera off' : 'Camera on';
};
</script>
</body>
</html>
